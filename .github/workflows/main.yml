name: Build QuickServe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore app source from ZIP
        shell: bash
        run: |
          if [ ! -f "src/main.tsx" ]; then
            echo "src/main.tsx not found. Restoring source from quickserve.zip..."
            rm -rf /tmp/quickserve-source
            mkdir -p /tmp/quickserve-source
            unzip -q quickserve.zip -d /tmp/quickserve-source
            SOURCE_DIR="$(find /tmp/quickserve-source -type f -name package.json -print -quit | xargs -r dirname)"
            if [ -z "$SOURCE_DIR" ]; then
              echo "ERROR: package.json was not found inside quickserve.zip"
              exit 1
            fi
            cp -a "$SOURCE_DIR"/. .
          fi
          test -f src/main.tsx
          echo "React source check: OK"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install native Geolocation plugin
        run: npm install @capacitor/geolocation --no-audit --no-fund

      - name: Inject native Geolocation bridge
        shell: bash
        run: |
          cat > src/quickserve-native-location.ts <<'EOF'
          import { Geolocation } from '@capacitor/geolocation';
          (window as any).__QuickServeNativeGeolocation = Geolocation;
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.tsx")
          text = p.read_text()
          marker = 'import "./quickserve-native-location";'
          if marker not in text:
              p.write_text(marker + "\n" + text)
          PY
          echo "Native Geolocation bridge: OK"

      - name: Build React app
        run: npm run build

      - name: Replace location handler with native GPS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacement = '''N=()=>{(async()=>{try{const G=window.__QuickServeNativeGeolocation;if(!G){l("Native GPS is not available in this APK");return}l("Requesting GPS location permission...");const P=await G.requestPermissions();if(P.location==="denied"){l("Location permission denied. Android Settings > Apps > QuickServe > Permissions > Location > Allow");return}l("Getting your current GPS location...");const O=await G.getCurrentPosition({enableHighAccuracy:true,timeout:15000});const U=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${O.coords.latitude}&longitude=${O.coords.longitude}&localityLanguage=en`);const W=await U.json();const A=W.city||W.locality||W.principalSubdivision||"Current Location";const V=W.locality||W.city||"GPS Location";s({city:A,area:V});e(!1);l(`GPS Location locked: ${V}, ${A}`)}catch(X){console.error("QuickServe native GPS error",X);const C=X&&X.code;if(C==="OS-PLUG-GLOC-0003")l("Location permission denied. Please allow location permission in Android Settings.");else if(C==="OS-PLUG-GLOC-0002")l("GPS location is unavailable. Please turn on Location/GPS.");else if(C==="OS-PLUG-GLOC-0004")l("GPS request timed out. Please try again outdoors or near a window.");else l("Could not get GPS location. Please turn ON Location and try again.")}})()}'''

          patched = 0
          for p in Path("dist").rglob("*.js"):
              text = p.read_text(errors="ignore")
              marker = 'GPS Location locked: Indiranagar, Bengaluru'
              pos = text.find(marker)
              if pos < 0:
                  continue

              # Find the arrow-function start immediately before the marker.
              start = text.rfind('N=()=>{', 0, pos)
              if start < 0:
                  # Fallback: locate any one-letter minified arrow function before the marker.
                  m = list(re.finditer(r'[A-Za-z_$][\w$]*=\(\)=>\{', text[:pos]))
                  if not m:
                      continue
                  start = m[-1].start()

              # Count braces to locate the end of that function.
              i = text.find('{', start)
              depth = 0
              end = None
              in_str = None
              esc = False
              for j in range(i, len(text)):
                  c = text[j]
                  if in_str:
                      if esc:
                          esc = False
                      elif c == '\\\\':
                          esc = True
                      elif c == in_str:
                          in_str = None
                      continue
                  if c in "\\\"'`":
                      in_str = c
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = j + 1
                          break
              if end is None:
                  raise SystemExit(f"ERROR: could not find end of location handler in {p}")

              old = text[start:end]
              # Preserve the actual minified function variable name and setter names
              # if Vite changed them, while using the known current QuickServe structure.
              head = re.match(r'([A-Za-z_$][\\w$]*)=\\(\\)=>\\{', old)
              if not head:
                  continue
              fn = head.group(1)
              # Existing handler in this app uses s/e/l for state/message setters.
              new = replacement.replace('N=()=>{', f'{fn}=()=>{{')
              text = text[:start] + new + text[end:]
              p.write_text(text)
              patched += 1
              print(f"Patched native GPS handler: {p}")
              break

          if patched != 1:
              raise SystemExit(f"ERROR: expected exactly 1 location handler, found {patched}")

          found = False
          for p in Path("dist").rglob("*.js"):
              text = p.read_text(errors="ignore")
              if "__QuickServeNativeGeolocation" in text and "requestPermissions" in text and "getCurrentPosition" in text:
                  found = True
                  print(f"Verified native GPS code in {p}")
                  break
          if not found:
              raise SystemExit("ERROR: native GPS code was not bundled")
          print("Native GPS location patch: OK")
          PY

      - name: Remove desktop/device preview wrapper from mobile build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patched = 0
          pattern = re.compile(r'J3=\(\{children:r\}\)=>\{const\{isDeviceFrame:e,setIsDeviceFrame:t\}=es\(\),.*?\},K3=\(\)=>', re.S)
          replacement = 'J3=({children:r})=>f.jsx("div",{className:"min-h-screen w-full bg-white text-neutral-900 overflow-hidden",children:r}),K3=()=>'
          for p in Path("dist").rglob("*.js"):
              text = p.read_text(errors="ignore")
              new_text, count = pattern.subn(replacement, text, count=1)
              if count:
                  p.write_text(new_text)
                  patched += count
                  print(f"Patched mobile wrapper: {p}")
          if patched != 1:
              raise SystemExit(f"ERROR: expected exactly 1 mobile wrapper, patched {patched}")
          for p in Path("dist").rglob("*.js"):
              text = p.read_text(errors="ignore")
              if 'children:"5G"' in text or 'children:"88%"' in text or 'toggle-view-mode-btn' in text:
                  raise SystemExit(f"ERROR: fake device UI still present in {p}")
          print("Mobile UI patch: OK")
          PY

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund

      - name: Initialize Capacitor
        run: npx cap init QuickServe com.quickserve.app --web-dir dist

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Add Android location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          permissions = '''    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'''
          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              pos = text.find(">", text.find("<manifest")) + 1
              text = text[:pos] + "\n" + permissions + text[pos:]
              p.write_text(text)
          PY
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          echo "Android location permissions: OK"

      - name: Fix Kotlin duplicate stdlib dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle")
          text = p.read_text()
          fix = '''\n\nsubprojects {\n    configurations.configureEach {\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n    }\n}\n'''
          if "kotlin-stdlib-jdk7" not in text or "exclude group: 'org.jetbrains.kotlin'" not in text:
              p.write_text(text + fix)
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickServe-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build QuickServe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get QuickServe source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Node.js
      # npm cache is disabled because this repository does not have package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build React/Vite web application
      - name: Build React app
        run: npm run build

      # 5. Install Capacitor
      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      # 6. Create Capacitor configuration
      - name: Initialize Capacitor
        run: npx cap init QuickServe com.quickserve.app --web-dir dist

      # 7. Create Android project
      - name: Add Android
        run: npx cap add android

      # 8. Copy web app into Android project
      - name: Sync Android
        run: npx cap sync android

      # 9. Install Java required by Android/Gradle
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 10. Build Debug APK
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 11. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickServe-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build QuickServe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore app source from ZIP
        shell: bash
        run: |
          if [ ! -f "src/main.tsx" ]; then
            echo "src/main.tsx not found. Restoring source from quickserve.zip..."
            rm -rf /tmp/quickserve-source
            mkdir -p /tmp/quickserve-source
            unzip -q quickserve.zip -d /tmp/quickserve-source
            SOURCE_DIR="$(find /tmp/quickserve-source -type f -name package.json -print -quit | xargs -r dirname)"
            if [ -z "$SOURCE_DIR" ]; then
              echo "ERROR: package.json was not found inside quickserve.zip"
              exit 1
            fi
            cp -a "$SOURCE_DIR"/. .
          fi
          test -f src/main.tsx
          echo "React source check: OK"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install native Geolocation plugin
        run: npm install @capacitor/geolocation --no-audit --no-fund

      - name: Inject native Geolocation bridge
        shell: bash
        run: |
          cat > src/quickserve-native-location.ts <<'EOF'
          import { Geolocation } from '@capacitor/geolocation';
          (window as any).__QuickServeNativeGeolocation = Geolocation;
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main.tsx")
          text = p.read_text()
          marker = 'import "./quickserve-native-location";'
          if marker not in text:
              p.write_text(marker + "\n" + text)
          PY
          echo "Native Geolocation bridge: OK"

      - name: Patch GPS handler at source level
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/App.tsx")
          if not p.exists():
              raise SystemExit("ERROR: src/App.tsx not found")
          text = p.read_text()

          marker = "GPS Location locked: Indiranagar, Bengaluru"
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit("ERROR: source GPS marker not found in src/App.tsx")

          # Find the arrow-function declaration containing the old hard-coded GPS handler.
          matches = list(re.finditer(r"(?:const|let)\\s+([A-Za-z_$][\\w$]*)\\s*=\\s*(?:async\\s*)?\\([^)]*\\)\\s*=>\\s*\\{", text[:pos]))
          if not matches:
              raise SystemExit("ERROR: could not find source location handler declaration")
          m = matches[-1]
          fn = m.group(1)
          start = m.start()
          brace = text.find("{", m.start(), m.end() + 1)

          # Brace-match the complete arrow function while respecting strings/comments.
          depth = 0
          end = None
          i = brace
          quote = None
          esc = False
          line_comment = False
          block_comment = False
          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ""
              if line_comment:
                  if c == "\\n": line_comment = False
              elif block_comment:
                  if c == "*" and n == "/":
                      block_comment = False
                      i += 1
              elif quote:
                  if esc:
                      esc = False
                  elif c == "\\":
                      esc = True
                  elif c == quote:
                      quote = None
              else:
                  if c == "/" and n == "/":
                      line_comment = True
                      i += 1
                  elif c == "/" and n == "*":
                      block_comment = True
                      i += 1
                  elif c in "'\"`":
                      quote = c
                  elif c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              i += 1

          if end is None:
              raise SystemExit("ERROR: could not find end of source location handler")

          old = text[start:end]

          # Detect the existing React setter names instead of assuming minified names.
          lm = re.search(r"(set[A-Za-z0-9_$]*)\\(\\{\\s*city\\s*:\\s*['\"]Bengaluru['\"]\\s*,\\s*area\\s*:\\s*['\"]Indiranagar['\"]\\s*\\}\\)", old)
          mm = re.search(r"(set[A-Za-z0-9_$]*)\\(\\s*false\\s*\\)", old)
          sm = re.search(r"(set[A-Za-z0-9_$]*)\\(\\s*['\"]GPS Location locked", old)
          if not (lm and mm and sm):
              print("Old handler found, but setter names were not all detected. Handler source:")
              print(old)
              raise SystemExit("ERROR: could not detect location/modal/message React setters")

          set_location = lm.group(1)
          set_modal = mm.group(1)
          set_message = sm.group(1)

          replacement = f'''const {fn} = async () => {{
            try {{
              const G = (window as any).__QuickServeNativeGeolocation;
              if (!G) {{
                {set_message}("Native GPS is not available in this APK");
                return;
              }}

              {set_message}("Requesting GPS location permission...");
              const P = await G.requestPermissions();
              if (P.location === "denied") {{
                {set_message}("Location permission denied. Please allow Location permission in Android Settings.");
                return;
              }}

              {set_message}("Getting your current GPS location...");
              const O = await G.getCurrentPosition({{ enableHighAccuracy: true, timeout: 15000 }});

              let city = "Current Location";
              let area = "GPS Location";
              try {{
                const U = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${{O.coords.latitude}}&longitude=${{O.coords.longitude}}&localityLanguage=en`);
                const W = await U.json();
                city = W.city || W.locality || W.principalSubdivision || city;
                area = W.locality || W.city || area;
              }} catch (geocodeError) {{
                console.warn("QuickServe reverse geocoding failed", geocodeError);
              }}

              {set_location}({{ city, area }});
              {set_modal}(false);
              {set_message}(`GPS Location locked: ${{area}}, ${{city}}`);
            }} catch (X) {{
              console.error("QuickServe native GPS error", X);
              const C = X && X.code;
              if (C === "OS-PLUG-GLOC-0003") {{
                {set_message}("Location permission denied. Please allow Location permission in Android Settings.");
              }} else if (C === "OS-PLUG-GLOC-0002") {{
                {set_message}("GPS location is unavailable. Please turn ON Location/GPS.");
              }} else if (C === "OS-PLUG-GLOC-0004") {{
                {set_message}("GPS request timed out. Please try again outdoors or near a window.");
              }} else {{
                {set_message}("Could not get GPS location. Please turn ON Location and try again.");
              }}
            }}
          }}'''

          p.write_text(text[:start] + replacement + text[end:])
          print(f"Source GPS handler patched: {fn}")
          print(f"Location setter: {set_location}; modal setter: {set_modal}; message setter: {set_message}")
          PY
          echo "Source-level GPS patch: OK"

      - name: Build React app
        run: npm run build

      - name: Remove desktop/device preview wrapper from mobile build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patched = 0
          pattern = re.compile(r'J3=\\(\\{children:r\\}\\)=>\\{const\\{isDeviceFrame:e,setIsDeviceFrame:t\\}=es\\(\\),.*?\\},K3=\\(\\)=>', re.S)
          replacement = 'J3=({children:r})=>f.jsx("div",{className:"min-h-screen w-full bg-white text-neutral-900 overflow-hidden",children:r}),K3=()=>'
          for p in Path("dist").rglob("*.js"):
              text = p.read_text(errors="ignore")
              new_text, count = pattern.subn(replacement, text, count=1)
              if count:
                  p.write_text(new_text)
                  patched += count
                  print(f"Patched mobile wrapper: {p}")
          if patched != 1:
              raise SystemExit(f"ERROR: expected exactly 1 mobile wrapper, patched {patched}")
          for p in Path("dist").rglob("*.js"):
              text = p.read_text(errors="ignore")
              if 'children:"5G"' in text or 'children:"88%"' in text or 'toggle-view-mode-btn' in text:
                  raise SystemExit(f"ERROR: fake device UI still present in {p}")
          print("Mobile UI patch: OK")
          PY

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund

      - name: Initialize Capacitor
        run: npx cap init QuickServe com.quickserve.app --web-dir dist

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Add Android location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          permissions = '''    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'''
          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              pos = text.find(">", text.find("<manifest")) + 1
              text = text[:pos] + "\n" + permissions + text[pos:]
              p.write_text(text)
          PY
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          echo "Android location permissions: OK"

      - name: Fix Kotlin duplicate stdlib dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle")
          text = p.read_text()
          fix = '''\n\nsubprojects {\n    configurations.configureEach {\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n    }\n}\n'''
          if "kotlin-stdlib-jdk7" not in text or "exclude group: 'org.jetbrains.kotlin'" not in text:
              p.write_text(text + fix)
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickServe-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build QuickServe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore app source from ZIP
        shell: bash
        run: |
          if [ ! -f "src/main.tsx" ]; then
            echo "src/main.tsx not found. Restoring source from quickserve.zip..."
            rm -rf /tmp/quickserve-source
            mkdir -p /tmp/quickserve-source
            unzip -q quickserve.zip -d /tmp/quickserve-source
            SOURCE_DIR="$(find /tmp/quickserve-source -type f -name package.json -print -quit | xargs -r dirname)"
            if [ -z "$SOURCE_DIR" ]; then
              echo "ERROR: package.json was not found inside quickserve.zip"
              exit 1
            fi
            cp -a "$SOURCE_DIR"/. .
          fi

          if [ ! -f "src/main.tsx" ]; then
            echo "ERROR: src/main.tsx is still missing after ZIP restore."
            exit 1
          fi
          echo "React source check: OK"
          ls -la src | head -30

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React app
        run: npm run build

      - name: Fix real GPS location in mobile build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          target = re.compile(
              r'N=\(\)=>\{s\(\{city:"Bengaluru",area:"Indiranagar"\}\),e\(!1\),l\("GPS Location locked: Indiranagar, Bengaluru"\)\}'
          )

          replacement = '''N=()=>{\
          if(!navigator.geolocation){l("Location is not supported on this device");return}\
          l("Getting your current GPS location...");\
          navigator.geolocation.getCurrentPosition(async O=>{\
          try{\
          const U=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${O.coords.latitude}&longitude=${O.coords.longitude}&localityLanguage=en`);\
          const W=await U.json();\
          const A=W.city||W.locality||W.principalSubdivision||"Current Location";\
          const V=W.locality||W.city||"GPS Location";\
          s({city:A,area:V});\
          e(!1);\
          l(`GPS Location locked: ${V}, ${A}`);\
          }catch{\
          s({city:"Current Location",area:"GPS Location"});\
          e(!1);\
          l("GPS location found, but address lookup failed");\
          }\
          },O=>{\
          if(O.code===1)l("Location permission denied. Please allow location permission in Android settings.");\
          else if(O.code===2)l("GPS location unavailable. Please turn on Location/GPS.");\
          else if(O.code===3)l("GPS request timed out. Please try again.");\
          else l("Unable to get your current location. Please try again.");\
          },{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}'''

          patched = 0
          for p in Path("dist").rglob("*.js"):
              text = p.read_text(errors="ignore")
              new_text, count = target.subn(replacement, text, count=1)
              if count:
                  p.write_text(new_text)
                  patched += count
                  print(f"Patched GPS location: {p}")

          if patched != 1:
              raise SystemExit(f"ERROR: expected exactly 1 GPS handler to patch, found {patched}")
          print("Real GPS location patch: OK")
          PY

      - name: Remove desktop/device preview wrapper from mobile build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          patched = 0
          pattern = re.compile(
              r'J3=\(\{children:r\}\)=>\{const\{isDeviceFrame:e,setIsDeviceFrame:t\}=es\(\),.*?\},K3=\(\)=>',
              re.S,
          )
          replacement = 'J3=({children:r})=>f.jsx("div",{className:"min-h-screen w-full bg-white text-neutral-900 overflow-hidden",children:r}),K3=()=>'

          for p in Path("dist").rglob("*.js"):
              text = p.read_text(errors="ignore")
              new_text, count = pattern.subn(replacement, text, count=1)
              if count:
                  p.write_text(new_text)
                  patched += count
                  print(f"Patched mobile wrapper: {p}")

          if patched != 1:
              raise SystemExit(f"ERROR: expected to patch exactly 1 mobile wrapper, patched {patched}")

          for p in Path("dist").rglob("*.js"):
              text = p.read_text(errors="ignore")
              if 'children:"5G"' in text or 'children:"88%"' in text or 'toggle-view-mode-btn' in text:
                  raise SystemExit(f"ERROR: fake device UI still present in {p}")

          print("Mobile UI patch: OK")
          PY

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund

      - name: Initialize Capacitor
        run: npx cap init QuickServe com.quickserve.app --web-dir dist

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Add Android location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          permissions = '''    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'''
          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text.replace("<manifest ", "<manifest ", 1)
              pos = text.find(">", text.find("<manifest")) + 1
              text = text[:pos] + "\n" + permissions + text[pos:]
              p.write_text(text)
          PY
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          echo "Android location permissions: OK"

      - name: Fix Kotlin duplicate stdlib dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle")
          text = p.read_text()
          fix = '''\n\n// Keep Kotlin stdlib dependencies compatible with the generated Capacitor project.\nsubprojects {\n    configurations.configureEach {\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n    }\n}\n'''
          if "kotlin-stdlib-jdk7" not in text or "exclude group: 'org.jetbrains.kotlin'" not in text:
              p.write_text(text + fix)
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickServe-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
